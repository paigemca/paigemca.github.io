    <script>
        function initCarousel(carousel, { swipe = false } = {}) {
            const slides = carousel.querySelectorAll('.slide');
            const dots   = carousel.querySelectorAll('.dot');
            if (!slides.length) return;
            let idx = 0;
            carousel.querySelector('.prev-btn').addEventListener('click', () => shift(-1));
            carousel.querySelector('.next-btn').addEventListener('click', () => shift(1));

            if (swipe) {
                let touchStartX = 0;
                carousel.addEventListener('touchstart', e => {
                    touchStartX = e.touches[0].clientX;
                }, { passive: true });
                carousel.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    if (Math.abs(dx) > 40) shift(dx < 0 ? 1 : -1);
                });
            }
            function shift(dir) {
                slides[idx].classList.remove('active');
                dots[idx].classList.remove('active');
                idx = (idx + dir + slides.length) % slides.length;
                slides[idx].classList.add('active');
                dots[idx].classList.add('active');
            }
        }

        // Init all static carousels (Pinterest, concerts)
        document.querySelectorAll('.carousel:not(#books-carousel)').forEach(initCarousel);

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function safeUrl(s) {
            return /^https?:\/\//.test(s) ? s : '';
        }

        // Books carousel — fetched from Goodreads RSS via CORS proxy
        async function loadBooks() {
            const rss   = 'https://www.goodreads.com/review/list_rss/76233379?shelf=read&sort=date_read&per_page=20';
            const url   = 'https://corsproxy.io/?' + encodeURIComponent(rss);
            const carousel = document.getElementById('books-carousel');
            const dots  = carousel.querySelector('.carousel-dots');
            const controls = carousel.querySelector('.carousel-controls');

            try {
                const text = await fetch(url).then(r => r.text());
                const doc  = new DOMParser().parseFromString(text, 'text/xml');
                const items = Array.from(doc.querySelectorAll('item'));

                const books = items.slice(0, 20).map(item => ({
                    title:  (item.querySelector('title')?.textContent ?? '').replace(/\s*\(.*\)$/, ''),
                    author: item.querySelector('author_name')?.textContent ?? '',
                    cover:  item.querySelector('book_large_image_url')?.textContent ?? '',
                    link:   item.querySelector('link')?.textContent ?? ''
                }));

                const PER_PAGE = 4;
                const pages = [];
                for (let i = 0; i < books.length; i += PER_PAGE) pages.push(books.slice(i, i + PER_PAGE));
                pages.splice(5);

                pages.forEach((page, pi) => {
                    const slide = document.createElement('div');
                    slide.className = 'slide' + (pi === 0 ? ' active' : '');
                    slide.innerHTML = `<div class="books-page">${page.map(b =>
                        `<a href="${safeUrl(b.link)}" target="_blank" rel="noopener" class="book-card">
                            <img src="${safeUrl(b.cover)}" alt="${escHtml(b.title)}" loading="lazy">
                            <span class="book-title">${escHtml(b.title)}</span>
                            <span class="book-author">${escHtml(b.author)}</span>
                        </a>`
                    ).join('')}</div>`;
                    carousel.insertBefore(slide, controls);

                    if (pi > 0) {
                        const dot = document.createElement('span');
                        dot.className = 'dot';
                        dots.appendChild(dot);
                    }
                });

                initCarousel(carousel, { swipe: true });
            } catch {
                controls.insertAdjacentHTML('beforebegin',
                    '<p class="books-error">Could not load books right now.</p>');
            }
        }

        loadBooks();

    </script>

    <script>
        function layoutPaintedTitle() {
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
            const vw = window.innerWidth;
            const targetH = Math.min(Math.max(2.4 * rem, 0.07 * vw), 4.5 * rem);

            document.querySelectorAll('.title-word-wrap').forEach(wrap => {
                const img = wrap.querySelector('.title-word');
                function apply() {
                    const nW = img.naturalWidth, nH = img.naturalHeight;
                    if (!nW) return;
                    const imgW = targetH;
                    const imgH = targetH * (nH / nW);
                    wrap.style.width  = imgH + 'px';
                    wrap.style.height = imgW + 'px';
                    img.style.position = 'absolute';
                    img.style.width    = imgW + 'px';
                    img.style.height   = imgH + 'px';
                    img.style.left     = ((imgH - imgW) / 2) + 'px';
                    img.style.top      = ((imgW - imgH) / 2) + 'px';
                }
                if (img.complete && img.naturalWidth > 0) apply();
                else img.addEventListener('load', apply);
            });
        }
        layoutPaintedTitle();

        function layoutSectionHeadings() {
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);

            document.querySelectorAll('.section-heading-wrap').forEach(wrap => {
                const img = wrap.querySelector('.section-heading-img');
                const targetH = parseFloat(wrap.dataset.size || 2.2) * rem;
                const rotateDeg = parseFloat(wrap.dataset.rotate || -90);
                function apply() {
                    const nW = img.naturalWidth, nH = img.naturalHeight;
                    if (!nW) return;
                    const imgW = targetH;
                    const imgH = targetH * (nH / nW);
                    wrap.style.width  = imgH + 'px';
                    wrap.style.height = imgW + 'px';
                    img.style.position = 'absolute';
                    img.style.width    = imgW + 'px';
                    img.style.height   = imgH + 'px';
                    img.style.left     = ((imgH - imgW) / 2) + 'px';
                    img.style.top      = ((imgW - imgH) / 2) + 'px';
                    img.style.transform = 'rotate(' + rotateDeg + 'deg)';
                }
                if (img.complete && img.naturalWidth > 0) apply();
                else img.addEventListener('load', apply);
            });
        }
        layoutSectionHeadings();

        window.addEventListener('resize', layoutPaintedTitle);

    </script>
